name: Deploy ingester (single server)

# Rolls the otlp-ingester on a self-hosted EC2/Lightsail box running
# deploy/single-server/docker-compose.yml — SSHes in, refreshes
# docker-compose.yml, pulls the image, and recreates the service. ClickHouse
# and Caddy are left untouched (only the otlp-ingester service is recreated);
# in particular the Caddyfile is never overwritten — boxes customize it with
# extra routes, and a routine ingester roll must not clobber that.
#
# Ingester code changes deploy from workflow_run, after "Docker image (GHCR)"
# has pushed that commit's image, and pin the box to its sha-<short> tag.
# Triggering on the push itself raced the build: the deploy could pull the
# previous :latest and finish before the new image existed. A box whose .env
# pins INGESTER_TAG to anything other than latest keeps its pin.
#
# Repo VARIABLES required:
#   SINGLE_SERVER_HOST          the box's IP or hostname
#   SINGLE_SERVER_USER          SSH user (e.g. ubuntu)
#   SINGLE_SERVER_PATH          remote directory holding docker-compose.yml + .env
#   SINGLE_SERVER_AUTODEPLOY_ENABLED   "true" to deploy on pushes to main
# Repo SECRETS required:
#   SINGLE_SERVER_SSH_KEY       private key matching an authorized_keys entry on the box

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Docker image (GHCR)"]
    types: [completed]
    branches: [main]
  # Compose/workflow-only changes need no new image; they roll the current one.
  push:
    branches: [main]
    paths:
      - "deploy/single-server/**"
      - ".github/workflows/deploy-single-server.yml"

permissions:
  contents: read

concurrency:
  group: deploy-single-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.SINGLE_SERVER_AUTODEPLOY_ENABLED == 'true' &&
       (github.event_name == 'push' ||
        (github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.conclusion == 'success')))
    steps:
      - name: Resolve commit and image tag
        id: target
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$RUN_SHA" ]; then
            echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
            # Matches docker/metadata-action's type=sha tag in docker.yml.
            echo "tag=sha-${RUN_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SINGLE_SERVER_HOST }}
          username: ${{ vars.SINGLE_SERVER_USER }}
          key: ${{ secrets.SINGLE_SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ vars.SINGLE_SERVER_PATH }}"
            curl -fsSL -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.target.outputs.sha }}/deploy/single-server/docker-compose.yml
            tag="${{ steps.target.outputs.tag }}"
            pinned="$(sed -n 's/^INGESTER_TAG=//p' .env 2>/dev/null | tail -n1 || true)"
            if [ -n "$tag" ] && { [ -z "$pinned" ] || [ "$pinned" = latest ]; }; then
              export INGESTER_TAG="$tag"
            fi
            echo "Deploying otlp-ingester:${INGESTER_TAG:-${pinned:-latest}}"
            docker compose pull otlp-ingester
            docker compose up -d otlp-ingester
            docker image prune -f
