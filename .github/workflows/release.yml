name: Release

# Publishes all public packages to npm with provenance.
# Trigger: push a version tag (v0.1.0) or run manually from the Actions tab.
# Requires the NPM_TOKEN repo secret (npm automation token with publish
# rights on the @autter scope).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    # npm provenance currently accepts GitHub-hosted runners only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # npm answers a publish it refuses with E404, so name the account the
      # token signs in as before building: an expired token, or one from an
      # account without write access to @autter, fails here with a clear error.
      - name: Check the npm token
        run: |
          user=$(npm whoami) || { echo "::error::NPM_TOKEN is invalid or expired (npm whoami failed)"; exit 1; }
          echo "NPM_TOKEN signs in as npm user: $user"
          if ! npm access list collaborators @autter/runtime-browser 2>/dev/null | grep -q "$user"; then
            echo "::warning::npm user $user is not a collaborator on @autter/runtime-browser; publishes will fail with E404"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm install
      - run: npm run build
      - run: npm run size -w @autter/runtime-browser
      - name: Publish packages (skips versions that already exist)
        run: |
          # runtime-core is private (bundled into node + edge) and never published.
          # Dependencies first: runtime-next depends on node, edge and browser.
          # runtime-cli (source map CLI + bundler plugins) has no package deps.
          for pkg in runtime-browser runtime-node runtime-edge runtime-next runtime-cli otlp-ingester; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published — skipping"
            else
              echo "Publishing $name@$version"
              npm publish -w "$name"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
