name: Release

# Publishes all public packages to npm with provenance.
# Trigger: push a version tag (v0.1.0) or run manually from the Actions tab.
#
# Authenticates with npm trusted publishing (OIDC), not a stored token: each
# package's settings on npmjs.com trust this workflow (Autter-dev/autter-runtime,
# release.yml). A new public package needs its own trusted publisher before its
# first release from here, and renaming this file means recreating them all.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    # npm trusted publishing accepts GitHub-hosted runners only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run size -w @autter/runtime-browser
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - name: Update npm
        run: |
          npm install -g npm@11
          npm --version
      - name: Publish packages (skips versions that already exist)
        run: |
          # runtime-core is private (bundled into node + edge) and never published.
          # Dependencies first: runtime-next depends on node, edge and browser.
          # runtime-cli (source map CLI + bundler plugins) has no package deps.
          for pkg in runtime-browser runtime-node runtime-edge runtime-next runtime-cli otlp-ingester; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published — skipping"
            else
              echo "Publishing $name@$version"
              npm publish -w "$name"
            fi
          done
