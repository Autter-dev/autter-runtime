services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-autter_runtime}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      # Archive bucket as a ClickHouse named collection (optional, README
      # "Archive bucket"): with ARCHIVE_S3_NAMED_COLLECTION and ARCHIVE_S3_URL
      # set, the entrypoint below defines that collection with this URL and
      # these keys. The keys go to ClickHouse only, never to the ingester.
      ARCHIVE_S3_NAMED_COLLECTION: ${ARCHIVE_S3_NAMED_COLLECTION:-}
      ARCHIVE_S3_URL: ${ARCHIVE_S3_URL:-}
      ARCHIVE_S3_COLLECTION_ACCESS_KEY_ID: ${ARCHIVE_S3_COLLECTION_ACCESS_KEY_ID:-}
      ARCHIVE_S3_COLLECTION_SECRET_ACCESS_KEY: ${ARCHIVE_S3_COLLECTION_SECRET_ACCESS_KEY:-}
    # The image's own entrypoint, after writing (or removing) two files for
    # the collection. Without ARCHIVE_S3_NAMED_COLLECTION and ARCHIVE_S3_URL
    # nothing is written and ClickHouse starts exactly as the plain image.
    # With them:
    #   config.d/zz-autter-archive-collection.xml  the collection; each value
    #     is `from_env`, so the keys are read from this container's
    #     environment at start and never written to a file, and
    #     hide_in_preprocessed keeps them out of preprocessed_configs/ on the
    #     data volume. system.named_collections shows them as [HIDDEN].
    #   users.d/zz-autter-archive-collection.xml   named_collection_control
    #     for CLICKHOUSE_USER (ClickHouse refuses s3(<collection>, ...) to a
    #     users.xml user without it); not show_named_collections_secrets.
    # A bad value is reported in `docker compose logs clickhouse` and the
    # collection is skipped: ClickHouse still starts. ($$ is a literal $.)
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -eu
        conf=/etc/clickhouse-server/config.d/zz-autter-archive-collection.xml
        users=/etc/clickhouse-server/users.d/zz-autter-archive-collection.xml
        rm -f "$$conf" "$$users"
        name="$${ARCHIVE_S3_NAMED_COLLECTION:-}"
        url="$${ARCHIVE_S3_URL:-}"
        key="$${ARCHIVE_S3_COLLECTION_ACCESS_KEY_ID:-}"
        secret="$${ARCHIVE_S3_COLLECTION_SECRET_ACCESS_KEY:-}"
        user="$${CLICKHOUSE_USER:-default}"
        skip() { echo "autter: archive named collection not created: $$*" >&2; }
        if [ -z "$$name" ] || [ -z "$$url" ]; then
          if [ -n "$$key$$secret" ]; then
            skip "ARCHIVE_S3_COLLECTION_* keys are set but ARCHIVE_S3_NAMED_COLLECTION or ARCHIVE_S3_URL is not"
          fi
        elif ! [[ "$$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$$ ]]; then
          skip "ARCHIVE_S3_NAMED_COLLECTION is not an identifier"
        elif ! [[ "$$user" =~ ^[A-Za-z_][A-Za-z0-9_.-]*$$ ]]; then
          skip "CLICKHOUSE_USER cannot be written as an XML element"
        elif [[ -n "$$key" && -z "$$secret" || -z "$$key" && -n "$$secret" ]]; then
          skip "set both ARCHIVE_S3_COLLECTION_ACCESS_KEY_ID and ARCHIVE_S3_COLLECTION_SECRET_ACCESS_KEY, or neither"
        elif [[ "$$url$$key$$secret" == *'<'* || "$$url$$key$$secret" == *'&'* ]]; then
          # from_env values are parsed as XML: these would stop ClickHouse.
          skip "the URL or a key contains < or &"
        else
          {
            echo "<clickhouse><named_collections><$$name hide_in_preprocessed=\"true\">"
            echo "<url from_env=\"ARCHIVE_S3_URL\"/>"
            if [ -n "$$key" ]; then
              echo "<access_key_id from_env=\"ARCHIVE_S3_COLLECTION_ACCESS_KEY_ID\"/>"
              echo "<secret_access_key from_env=\"ARCHIVE_S3_COLLECTION_SECRET_ACCESS_KEY\"/>"
            fi
            echo "</$$name></named_collections></clickhouse>"
          } > "$$conf"
          echo "<clickhouse><users><$$user><named_collection_control>1</named_collection_control></$$user></users></clickhouse>" > "$$users"
          echo "autter: archive named collection $$name defined for user $$user"
        fi
        exec /entrypoint.sh
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    # Not published to the host — only the ingester talks to it, over the
    # internal compose network. Never expose 8123/9000 publicly.
    healthcheck:
      # 127.0.0.1, not localhost: in-container localhost resolves to ::1, but
      # ClickHouse's IPv6 bind can silently fail (listen_try), leaving only
      # 0.0.0.0 listening and the check refused forever.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  otlp-ingester:
    image: ghcr.io/autter-dev/otlp-ingester:${INGESTER_TAG:-latest}
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      PORT: 4318
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-autter_runtime}
      # Static key → tenant mapping (self-host mode). See ../README or the
      # main README's "self-hosting" section for the JSON shape.
      AUTTER_INGEST_KEYS: ${AUTTER_INGEST_KEYS:-}
      # Cloud-connected mode instead of AUTTER_INGEST_KEYS (mutually exclusive
      # with it in practice — set whichever matches your setup):
      AUTTER_KEY_VALIDATOR_URL: ${AUTTER_KEY_VALIDATOR_URL:-}
      AUTTER_KEY_VALIDATOR_TOKEN: ${AUTTER_KEY_VALIDATOR_TOKEN:-}
      AUTTER_SINK_URL: ${AUTTER_SINK_URL:-}
      AUTTER_SINK_TOKEN: ${AUTTER_SINK_TOKEN:-}
      # Caddy is the one proxy hop in front: trust its X-Forwarded-For for
      # the per-address limits. One ingester, so limits need no Redis.
      TRUST_PROXY: 1
      # Tiered retention (optional, docs/RETENTION.md): days older than each
      # table's hot window go to Parquet in a bucket ClickHouse can write
      # (S3, GCS's S3 endpoint with HMAC keys, MinIO, R2). Unset = off, the
      # TTLs delete as before. The one ingester here runs the archive job.
      # With ARCHIVE_S3_NAMED_COLLECTION, ClickHouse defines the collection
      # (see the clickhouse service) and ARCHIVE_S3_ACCESS_KEY_ID/SECRET stay
      # unset: the ingester refuses keys next to a named collection.
      OCCURRENCE_TTL_DAYS: ${OCCURRENCE_TTL_DAYS:-14}
      SPAN_TTL_DAYS: ${SPAN_TTL_DAYS:-7}
      ARCHIVE_S3_URL: ${ARCHIVE_S3_URL:-}
      ARCHIVE_S3_NAMED_COLLECTION: ${ARCHIVE_S3_NAMED_COLLECTION:-}
      ARCHIVE_S3_ACCESS_KEY_ID: ${ARCHIVE_S3_ACCESS_KEY_ID:-}
      ARCHIVE_S3_SECRET_ACCESS_KEY: ${ARCHIVE_S3_SECRET_ACCESS_KEY:-}
      ARCHIVE_RETENTION_DAYS: ${ARCHIVE_RETENTION_DAYS:-365}
    volumes:
      # Undelivered sink batches survive restarts and image upgrades and are
      # re-sent on start (SINK_OUTBOX_DIR, set in the image).
      - sink_outbox:/var/lib/autter/sink-outbox
    healthcheck:
      # Readiness, not just "the process is up": 200 only when the ingester
      # can write to ClickHouse with its credentials. /livez is liveness.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4318/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Not published to the host — only Caddy reaches it, over the internal
    # compose network. TLS termination and the public port live on Caddy.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - otlp-ingester
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. otlp.yourdomain.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  clickhouse_data:
  sink_outbox:
  caddy_data:
  caddy_config:
