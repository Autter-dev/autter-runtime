services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_PASSWORD: dev
    ulimits:
      nofile: 262144
    healthcheck:
      # 127.0.0.1, not localhost: in-container localhost resolves to ::1, but
      # ClickHouse's IPv6 bind can silently fail (listen_try) — e.g. on Docker
      # Desktop for Mac — leaving only 0.0.0.0 listening and the check refused.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      retries: 10

  ingester:
    build:
      context: .
      dockerfile: packages/otlp-ingester/Dockerfile
    ports:
      - "4318:4318"
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_PASSWORD: dev
      # Local only: accept the built-in key autter_rt_local_dev_only from this
      # machine, so `docker compose up` works without a key step. The ingester
      # refuses that key from other networks, refuses this flag next to a key
      # validator, and ignores the key without the flag. Never copy this line
      # to a deployed ingester (deploy/single-server does not pass it).
      AUTTER_LOCAL_DEV: ${AUTTER_LOCAL_DEV:-1}
      # Your own keys work too (optional; e.g. in the git-ignored .env file).
      AUTTER_INGEST_KEYS: ${AUTTER_INGEST_KEYS:-}
      AUTTER_SINK_URL: ${AUTTER_SINK_URL:-}
      AUTTER_SINK_TOKEN: ${AUTTER_SINK_TOKEN:-}
      # Exposed directly (no proxy): don't trust X-Forwarded-For.
      TRUST_PROXY: 0
      # Tiered retention against the local MinIO (docs/RETENTION.md):
      #   ARCHIVE_S3_URL=http://minio:9000/autter-archive/runtime       #   ARCHIVE_S3_ACCESS_KEY_ID=minioadmin ARCHIVE_S3_SECRET_ACCESS_KEY=minioadmin       #   docker compose --profile archive up
      # Unset (the default): no archive, the TTLs delete as before.
      ARCHIVE_S3_URL: ${ARCHIVE_S3_URL:-}
      ARCHIVE_S3_ACCESS_KEY_ID: ${ARCHIVE_S3_ACCESS_KEY_ID:-}
      ARCHIVE_S3_SECRET_ACCESS_KEY: ${ARCHIVE_S3_SECRET_ACCESS_KEY:-}
      ARCHIVE_RETENTION_DAYS: ${ARCHIVE_RETENTION_DAYS:-365}
      # Short hot windows make the archive visible within a day or two locally.
      OCCURRENCE_TTL_DAYS: ${OCCURRENCE_TTL_DAYS:-14}
      SPAN_TTL_DAYS: ${SPAN_TTL_DAYS:-7}
    volumes:
      # Undelivered sink batches: kept across restarts and re-sent.
      - sink_outbox:/var/lib/autter/sink-outbox
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      # Readiness: 200 only when the ingester can write to ClickHouse with
      # its credentials (a wrong password or a dropped table is unhealthy).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4318/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Local development UI for what the ingester stored: http://localhost:4319
  # (read-only; not part of any hosted or self-hosted deployment)
  dashboard:
    build: ./dashboard
    ports:
      - "127.0.0.1:4319:4319"
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_PASSWORD: dev
    depends_on:
      clickhouse:
        condition: service_healthy

  # Local object storage for the archive (profile "archive"): the console is
  # on http://localhost:9001 (minioadmin / minioadmin).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["archive"]
    command: server /data --console-address :9001
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  # Creates the archive bucket once MinIO is up.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["archive"]
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/autter-archive"

volumes:
  sink_outbox:
  minio_data:
