services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_PASSWORD: dev
    ulimits:
      nofile: 262144
    healthcheck:
      # 127.0.0.1, not localhost: in-container localhost resolves to ::1, but
      # ClickHouse's IPv6 bind can silently fail (listen_try) — e.g. on Docker
      # Desktop for Mac — leaving only 0.0.0.0 listening and the check refused.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      retries: 10

  ingester:
    build:
      context: .
      dockerfile: packages/otlp-ingester/Dockerfile
    ports:
      - "4318:4318"
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_PASSWORD: dev
      # No key is committed, so by default this is empty and the ingester
      # answers 401 to every export (it logs "No AUTTER_INGEST_KEYS … all
      # ingest requests will be rejected with 401" at boot). Generate a key
      # and its mapping in the git-ignored .env first (docs/GETTING-STARTED.md):
      #   export AUTTER_RUNTIME_KEY="autter_rt_$(openssl rand -hex 16)"
      #   printf 'AUTTER_INGEST_KEYS=[{"key":"%s","orgId":"local","repositoryId":"local"}]\n' "$AUTTER_RUNTIME_KEY" > .env
      # and give apps the same AUTTER_RUNTIME_KEY.
      AUTTER_INGEST_KEYS: ${AUTTER_INGEST_KEYS:-}
      AUTTER_SINK_URL: ${AUTTER_SINK_URL:-}
      AUTTER_SINK_TOKEN: ${AUTTER_SINK_TOKEN:-}
      # Exposed directly (no proxy): don't trust X-Forwarded-For.
      TRUST_PROXY: 0
    volumes:
      # Undelivered sink batches: kept across restarts and re-sent.
      - sink_outbox:/var/lib/autter/sink-outbox
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      # Readiness: 200 only when the ingester can write to ClickHouse with
      # its credentials (a wrong password or a dropped table is unhealthy).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4318/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  sink_outbox:
